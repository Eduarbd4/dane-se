<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --ink:#16233F; --paper:#FAF7F1; --paper-dim:#F1ECE2; --gold:#BB8A34;
    --sage:#5C7A63; --rust:#A8462E; --line:#DED6C4; --muted:#5C5748;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 50px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:4px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.6;margin-top:4px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);}
  .btn.ghost{background:transparent;color:var(--rust);border-color:var(--rust);}
  .headerRow{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .tabbar{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tabbtn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tabbtn.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .filter{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;}
  .filter label{font-size:11px;font-family:'IBM Plex Mono',monospace;opacity:.55;text-transform:uppercase;}
  .filter select{border:none;background:transparent;font-size:13px;color:var(--ink);outline:none;cursor:pointer;font-family:'Inter',sans-serif;max-width:220px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:32px;}
  .tag{position:relative;border-radius:4px 12px 4px 12px;padding:18px 20px 16px;border:1px solid var(--ink);box-shadow:2px 3px 0 rgba(22,35,63,.08);}
  .tag .dot{position:absolute;top:10px;left:10px;width:6px;height:6px;border-radius:50%;background:rgba(250,247,241,.4);}
  .tag.ink{background:var(--ink);color:var(--paper);}
  .tag.gold{background:var(--gold);color:#1B1305;border-color:var(--gold);}
  .tag.rust{background:var(--rust);color:var(--paper);border-color:var(--rust);}
  .tag.paper{background:var(--paper);color:var(--ink);border-color:var(--line);}
  .tag.paper .dot, .tag.gold .dot{background:rgba(27,19,5,.3);}
  .tag .label{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:8px;}
  .tag .value{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums;}
  .tag .subv{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;margin-top:6px;}
  .sectionHead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .sectionHead .eyebrow{margin:0;}
  .sectionHead h2{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0;}
  .sectionHead .rule{flex:1;height:1px;background:var(--line);}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
  .barRow{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .barLabel{width:128px;flex-shrink:0;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barTrack{flex:1;background:var(--paper-dim);border-radius:4px;height:22px;overflow:hidden;min-width:40px;}
  .barFill{height:100%;border-radius:4px;}
  .barVal{width:92px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .legend{display:flex;gap:16px;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;cursor:pointer;text-align:center;transition:all .15s;}
  .drop.over{border-color:var(--gold);background:var(--paper-dim);}
  .empty{max-width:640px;margin:30px auto;text-align:center;}
  .err{margin-top:14px;color:var(--rust);font-size:13px;display:flex;align-items:center;gap:6px;justify-content:center;}
  .footer{margin-top:30px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.45;}
  input[type=file]{display:none;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .analysisTxt{font-size:13px;line-height:1.65;white-space:pre-wrap;color:var(--ink);}
  .analysisMeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.5;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const MONTH_ABBR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONTH_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const brl=(v)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0);

function parseNumberBR(val){
  if(typeof val==='number') return val;
  if(val==null||val==='') return 0;
  let s=val.toString().trim();
  if(s.includes(',') && s.lastIndexOf(',')>s.lastIndexOf('.')){
    s=s.replace(/\./g,'').replace(',', '.');
  }
  const n=parseFloat(s.replace(/[^\d.\-]/g,''));
  return isNaN(n)?0:n;
}

function el(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(attrs[k]==null) continue;
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

function findAnyCol(headers, names){
  const norm=s=>(s||'').toString().trim().toLowerCase();
  const wanted=names.map(norm);
  return headers.findIndex(h=>wanted.includes(norm(h)));
}

// ---------- Config das abas Contas a Pagar / Contas a Receber ----------
const TABS = {
  pagar: {
    key:'pagar', label:'Contas a Pagar', storageKey:'dash-pagar-danese-v2',
    sheetRegex:/contas a pagar/i,
    entityHeaders:['Nome do fornecedor'],
    doneHeaders:['Valor total pago da parcela (R$)'],
    emptyEntityLabel:'Sem fornecedor identificado',
    parseErrorMsg:'Não reconheci as colunas deste arquivo. Envie o export "Visão Contas a Pagar" do Conta Azul, sem editar os cabeçalhos.',
    entityLabel:'Fornecedor', entityCountLabel:'Fornecedores',
    doneLabel:'Pago', openLabel:'Em aberto', lateLabel:'Atrasado',
    chartTitle:'Gastos por mês', rankEntityTitle:'Gastos por fornecedor',
    rankCategoryTitle:'Gastos por categoria', rankCentroTitle:'Gastos por centro de custo',
    emptyHint:'Envie o arquivo exportado do Conta Azul ("Visão Contas a Pagar") para montar o painel.',
    chartColor:'#16233F',
  },
  receber: {
    key:'receber', label:'Contas a Receber', storageKey:'dash-receber-danese-v2',
    sheetRegex:/contas a receber/i,
    entityHeaders:['Nome do cliente','Nome do contato','Nome do fornecedor'],
    doneHeaders:['Valor total recebido da parcela (R$)','Valor total pago da parcela (R$)'],
    emptyEntityLabel:'Sem cliente identificado',
    parseErrorMsg:'Não reconheci as colunas deste arquivo. Envie o export "Visão Contas a Receber" do Conta Azul, sem editar os cabeçalhos.',
    entityLabel:'Cliente', entityCountLabel:'Clientes',
    doneLabel:'Recebido', openLabel:'A receber', lateLabel:'Atrasado',
    chartTitle:'Recebimentos por mês', rankEntityTitle:'Recebimentos por cliente',
    rankCategoryTitle:'Recebimentos por categoria', rankCentroTitle:'Recebimentos por centro de custo',
    emptyHint:'Envie o arquivo exportado do Conta Azul ("Visão Contas a Receber") para montar o painel.',
    chartColor:'#5C7A63',
  },
};

async function parseContasGeneric(file, cfg){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheetName=wb.SheetNames.find(n=>cfg.sheetRegex.test(n))||wb.SheetNames[0];
  const ws=wb.Sheets[sheetName];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1, raw:true, defval:''});
  const headerIdx=rows.findIndex(r=>Array.isArray(r) && cfg.entityHeaders.some(name=>r.some(c=>(c||'').toString().trim()===name)));
  if(headerIdx===-1) throw new Error(cfg.parseErrorMsg);
  const headers=rows[headerIdx];
  const col={
    entidade: findAnyCol(headers, cfg.entityHeaders),
    vencimento: findAnyCol(headers, ['Data de vencimento']),
    situacao: findAnyCol(headers, ['Situação']),
    valorOriginal: findAnyCol(headers, ['Valor original da parcela (R$)']),
    valorFeito: findAnyCol(headers, cfg.doneHeaders),
    valorAberto: findAnyCol(headers, ['Valor total da parcela em aberto (R$)']),
    categoria: findAnyCol(headers, ['Categoria 1']),
    centro: findAnyCol(headers, ['Centro de Custo 1']),
  };
  if(col.entidade===-1||col.vencimento===-1||col.valorOriginal===-1) throw new Error(cfg.parseErrorMsg);
  const records=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length===0) continue;
    const venc=(r[col.vencimento]||'').toString().trim();
    if(!venc||!venc.includes('/')) continue;
    const parts=venc.split('/'); const mm=parts[1], yyyy=parts[2];
    if(!yyyy||!mm) continue;
    const entidade=(r[col.entidade]||'').toString().trim()||cfg.emptyEntityLabel;
    const situacao=(r[col.situacao]||'Não informado').toString().trim()||'Não informado';
    const catRaw=col.categoria>-1?(r[col.categoria]||'').toString():'';
    const categoria=catRaw.replace(/^[\d.]+\s*/,'').trim()||'Sem categoria';
    const centro=col.centro>-1?((r[col.centro]||'').toString().trim()||'Sem centro de custo'):null;
    const valorOriginal=Number(r[col.valorOriginal])||0;
    const valorFeito=col.valorFeito>-1?(Number(r[col.valorFeito])||0):0;
    const valorAberto=col.valorAberto>-1?(Number(r[col.valorAberto])||0):0;
    records.push({entidade,situacao,categoria,centro,valorOriginal,valorFeito,valorAberto,
      mesNum:parseInt(mm,10), ano:parseInt(yyyy,10), mesKey:`${yyyy}-${mm}`});
  }
  if(records.length===0) throw new Error('Não encontrei linhas de lançamento válidas neste arquivo.');
  return records;
}

// ---------- Config da aba Extrato Bancário ----------
const EXTRATO_CFG = {
  dataHeaders:['Data','Data do Lançamento','Data Lançamento','Data lançamento','Data lancamento'],
  descHeaders:['Descrição','Histórico','Descricao','Historico','Complemento','Detalhes'],
  valorHeaders:['Valor','Valor (R$)','Valor R$','Valor da Transação','Valor da transacao','Montante'],
  tipoHeaders:['Tipo','Natureza','D/C','Tipo Lançamento','Tipo lancamento'],
  saldoHeaders:['Saldo','Saldo (R$)','Saldo Final','Saldo final'],
};

function parseExtratoDate(raw){
  if(raw instanceof Date) return {dd:raw.getDate(), mm:raw.getMonth()+1, yyyy:raw.getFullYear()};
  const s=(raw||'').toString().trim();
  if(!s) return null;
  if(s.includes('/')){
    const [dd,mm,yyyy]=s.split('/');
    if(yyyy&&mm) return {dd:parseInt(dd,10), mm:parseInt(mm,10), yyyy:parseInt(yyyy.length===2?('20'+yyyy):yyyy,10)};
  } else if(s.includes('-')){
    const p=s.split('-');
    if(p[0].length===4){ return {dd:parseInt(p[2],10), mm:parseInt(p[1],10), yyyy:parseInt(p[0],10)}; }
  } else if(!isNaN(Number(s)) && Number(s)>20000 && Number(s)<60000){
    const d=new Date(Math.round((Number(s)-25569)*86400*1000));
    return {dd:d.getUTCDate(), mm:d.getUTCMonth()+1, yyyy:d.getUTCFullYear()};
  }
  return null;
}

async function parseExtrato(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheetName=wb.SheetNames.find(n=>/extrato/i.test(n))||wb.SheetNames[0];
  const ws=wb.Sheets[sheetName];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1, raw:true, defval:''});
  const cfg=EXTRATO_CFG;
  const headerIdx=rows.findIndex(r=>Array.isArray(r)
    && cfg.dataHeaders.some(name=>r.some(c=>(c||'').toString().trim()===name))
    && cfg.valorHeaders.some(name=>r.some(c=>(c||'').toString().trim()===name)));
  const errMsg='Não reconheci as colunas deste extrato. Preciso de pelo menos uma coluna de Data e uma de Valor (exportação em .xlsx ou .csv — OFX ainda não é suportado).';
  if(headerIdx===-1) throw new Error(errMsg);
  const headers=rows[headerIdx];
  const col={
    data: findAnyCol(headers, cfg.dataHeaders),
    desc: findAnyCol(headers, cfg.descHeaders),
    valor: findAnyCol(headers, cfg.valorHeaders),
    tipo: findAnyCol(headers, cfg.tipoHeaders),
    saldo: findAnyCol(headers, cfg.saldoHeaders),
  };
  if(col.data===-1||col.valor===-1) throw new Error(errMsg);
  const records=[];
  let lastSaldo=null;
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length===0) continue;
    const d=parseExtratoDate(r[col.data]);
    if(!d) continue;
    let valor=parseNumberBR(r[col.valor]);
    if(valor===0 && col.valor===-1) continue;
    const descricao=(col.desc>-1?(r[col.desc]||'').toString().trim():'') || 'Sem descrição';
    let tipo;
    if(col.tipo>-1){
      const t=(r[col.tipo]||'').toString().trim().toLowerCase();
      if(t.startsWith('d')) tipo='saida';
      else if(t.startsWith('c')) tipo='entrada';
      else tipo = valor<0?'saida':'entrada';
    } else {
      tipo = valor<0?'saida':'entrada';
    }
    if(col.saldo>-1){
      const sv=parseNumberBR(r[col.saldo]);
      if(r[col.saldo]!=='' ) lastSaldo=sv;
    }
    records.push({
      descricao, tipo, valorAbs: Math.abs(valor),
      mesNum:d.mm, ano:d.yyyy, mesKey:`${d.yyyy}-${String(d.mm).padStart(2,'0')}`,
    });
  }
  if(records.length===0) throw new Error('Não encontrei lançamentos válidos neste extrato.');
  return {records, saldoFinal:lastSaldo};
}

// ---------- Estado ----------
function blankAnalysis(){ return {text:null, loading:false, error:'', generatedAt:null}; }

let appState={
  activeTab:'pagar',
  data:{
    pagar:{records:null, updatedAt:null, error:'', f:{situacao:'Todas', mes:'Todos', entidade:'Todos', categoria:'Todas', centro:'Todos'}, analysis:blankAnalysis()},
    receber:{records:null, updatedAt:null, error:'', f:{situacao:'Todas', mes:'Todos', entidade:'Todos', categoria:'Todas', centro:'Todos'}, analysis:blankAnalysis()},
    extrato:{records:null, saldoFinal:null, updatedAt:null, error:'', f:{mes:'Todos', tipo:'Todas'}, analysis:blankAnalysis()},
  }
};

async function loadAll(){
  for(const k of ['pagar','receber']){
    try{
      const res=await window.storage.get(TABS[k].storageKey, false);
      if(res && res.value){
        const p=JSON.parse(res.value);
        appState.data[k].records=p.records; appState.data[k].updatedAt=p.updatedAt;
        appState.data[k].analysis=Object.assign(blankAnalysis(), p.analysis||{});
      }
    }catch(e){}
  }
  try{
    const res=await window.storage.get('dash-extrato-danese-v1', false);
    if(res && res.value){
      const p=JSON.parse(res.value);
      appState.data.extrato.records=p.records; appState.data.extrato.updatedAt=p.updatedAt; appState.data.extrato.saldoFinal=p.saldoFinal;
      appState.data.extrato.analysis=Object.assign(blankAnalysis(), p.analysis||{});
    }
  }catch(e){}
}
async function saveTab(k){
  const d=appState.data[k];
  const key = k==='extrato' ? 'dash-extrato-danese-v1' : TABS[k].storageKey;
  try{
    await window.storage.set(key, JSON.stringify({
      records:d.records, updatedAt:d.updatedAt, saldoFinal:d.saldoFinal,
      analysis:{text:d.analysis?.text||null, generatedAt:d.analysis?.generatedAt||null},
    }), false);
  }
  catch(e){ console.error('Falha ao salvar no banco de dados', e); }
}

// ---------- Análise automática por IA + exportações ----------
function downloadTextFile(filename, text){
  const blob=new Blob([text], {type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function exportCSV(key){
  const st=appState.data[key];
  if(!st.records||st.records.length===0) return;
  let headers, rows;
  if(key==='extrato'){
    headers=['Ano','Mes','Tipo','Descricao','Valor'];
    rows=st.records.map(r=>[r.ano, r.mesNum, r.tipo==='entrada'?'Entrada':'Saida', r.descricao, r.valorAbs.toFixed(2).replace('.',',')]);
  } else {
    const cfg=TABS[key];
    headers=[cfg.entityLabel,'Situacao','Categoria','Centro de Custo','Ano','Mes','Valor Original','Valor '+cfg.doneLabel,'Valor '+cfg.openLabel];
    rows=st.records.map(r=>[r.entidade, r.situacao, r.categoria, r.centro||'', r.ano, r.mesNum,
      r.valorOriginal.toFixed(2).replace('.',','), r.valorFeito.toFixed(2).replace('.',','), r.valorAberto.toFixed(2).replace('.',',')]);
  }
  const esc=v=>`"${(v??'').toString().replace(/"/g,'""')}"`;
  const csv='\uFEFF'+[headers.map(esc).join(';'), ...rows.map(r=>r.map(esc).join(';'))].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`${key}-export-powerbi.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function callClaudeAPI(prompt){
  const response=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content:prompt}] }),
  });
  if(!response.ok) throw new Error('Falha ao chamar a IA ('+response.status+')');
  const data=await response.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!text) throw new Error('Resposta vazia da IA.');
  return text;
}

function buildContasPrompt(key){
  const cfg=TABS[key]; const recs=appState.data[key].records;
  const totalOriginal=recs.reduce((s,r)=>s+r.valorOriginal,0);
  const totalFeito=recs.reduce((s,r)=>s+r.valorFeito,0);
  const totalAberto=recs.filter(r=>r.situacao==='Em aberto').reduce((s,r)=>s+r.valorAberto,0);
  const totalAtrasado=recs.filter(r=>r.situacao==='Atrasado').reduce((s,r)=>s+r.valorAberto,0);
  const somaPor=(campo)=>{ const m=new Map(); recs.forEach(r=>m.set(r[campo],(m.get(r[campo])||0)+r.valorOriginal));
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,v])=>`${n}: ${brl(v)}`).join('; '); };
  const porMes=new Map(); recs.forEach(r=>porMes.set(r.mesKey,(porMes.get(r.mesKey)||0)+r.valorOriginal));
  const evolucao=[...porMes.entries()].sort(([a],[b])=>a<b?-1:1).map(([k,v])=>`${k}: ${brl(v)}`).join('; ');
  return `Você é um analista financeiro. Escreva em português do Brasil, em texto corrido e sem markdown (250 a 400 palavras), uma análise dos dados de ${cfg.label} de uma empresa. Cubra: visão geral do total no período; situação de valores em aberto e atrasados (aponte riscos se houver valores atrasados relevantes); concentração em poucos ${cfg.entityLabel.toLowerCase()}s; categorias que mais pesam; evolução mês a mês. Termine com 2 a 3 recomendações práticas.

Dados:
- Total geral no período: ${brl(totalOriginal)}
- Total ${cfg.doneLabel.toLowerCase()}: ${brl(totalFeito)}
- Total ${cfg.openLabel.toLowerCase()}: ${brl(totalAberto)}
- Total ${cfg.lateLabel.toLowerCase()}: ${brl(totalAtrasado)}
- Top ${cfg.entityLabel.toLowerCase()}s por valor: ${somaPor('entidade')}
- Top categorias por valor: ${somaPor('categoria')}
- Evolução mensal (ano-mês: valor): ${evolucao}`;
}

function buildExtratoPrompt(){
  const recs=appState.data.extrato.records; const st=appState.data.extrato;
  const entradas=recs.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.valorAbs,0);
  const saidas=recs.filter(r=>r.tipo==='saida').reduce((s,r)=>s+r.valorAbs,0);
  const porMes=new Map();
  recs.forEach(r=>{ const cur=porMes.get(r.mesKey)||{entrada:0,saida:0}; if(r.tipo==='entrada') cur.entrada+=r.valorAbs; else cur.saida+=r.valorAbs; porMes.set(r.mesKey,cur); });
  const evolucao=[...porMes.entries()].sort(([a],[b])=>a<b?-1:1).map(([k,v])=>`${k}: entradas ${brl(v.entrada)} / saídas ${brl(v.saida)}`).join('; ');
  const somaDesc=(tipo)=>{ const m=new Map(); recs.filter(r=>r.tipo===tipo).forEach(r=>m.set(r.descricao,(m.get(r.descricao)||0)+r.valorAbs));
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,v])=>`${n}: ${brl(v)}`).join('; '); };
  return `Você é um analista financeiro. Escreva em português do Brasil, em texto corrido e sem markdown (250 a 400 palavras), uma análise do extrato bancário de uma empresa. Cubra: saldo do período e saldo final do extrato; evolução mês a mês; maiores saídas e o que indicam sobre os gastos; maiores entradas; sinais de atenção (ex: meses com saldo negativo, gastos concentrados). Termine com 2 a 3 recomendações práticas de fluxo de caixa.

Dados:
- Total de entradas no período: ${brl(entradas)}
- Total de saídas no período: ${brl(saidas)}
- Saldo do período: ${brl(entradas-saidas)}
- Saldo final do extrato: ${st.saldoFinal!=null?brl(st.saldoFinal):'não informado'}
- Evolução mensal: ${evolucao}
- Maiores saídas por descrição: ${somaDesc('saida')}
- Maiores entradas por descrição: ${somaDesc('entrada')}`;
}

async function gerarAnalise(key){
  const st=appState.data[key];
  if(!st.records||st.records.length===0) return;
  st.analysis=st.analysis||blankAnalysis();
  st.analysis.loading=true; st.analysis.error='';
  render();
  try{
    const prompt = key==='extrato' ? buildExtratoPrompt() : buildContasPrompt(key);
    const text=await callClaudeAPI(prompt);
    st.analysis.text=text;
    st.analysis.generatedAt=new Date().toISOString();
    await saveTab(key);
  }catch(e){
    st.analysis.error='Não consegui gerar a análise automática agora. Tente de novo em alguns segundos.';
  }
  st.analysis.loading=false;
  render();
}

// ---------- Componentes utilitários ----------
function kpiTag(label,value,tone,sub){
  const t=el('div',{class:'tag '+tone});
  t.appendChild(el('div',{class:'dot'}));
  t.appendChild(el('div',{class:'label'},label));
  t.appendChild(el('div',{class:'value'},value));
  if(sub) t.appendChild(el('div',{class:'subv'},sub));
  return t;
}
function sectionHead(eyebrow,title){
  return el('div',{class:'sectionHead'},[el('span',{class:'eyebrow'},eyebrow), el('h2',{},title), el('div',{class:'rule'})]);
}
function filterSelect(label, value, onChange, options){
  const select=el('select',{onchange:e=>onChange(e.target.value)},
    options.map(opt=>{
      const k=typeof opt==='string'?opt:opt.key;
      const l=typeof opt==='string'?opt:opt.label;
      return el('option',{value:k, selected: k===value?'selected':null}, l);
    }));
  return el('div',{class:'filter'},[el('label',{},label), select]);
}
function renderBars(data, color){
  const max=Math.max(...data.map(d=>d.valor),1);
  const wrap=el('div',{});
  if(data.length===0){ wrap.appendChild(el('div',{style:'font-size:12px;opacity:.5;padding:8px 0;'},'Sem dados para os filtros atuais.')); return wrap; }
  data.forEach(d=>{
    const pct=Math.max((d.valor/max)*100, 2);
    wrap.appendChild(el('div',{class:'barRow'},[
      el('div',{class:'barLabel', title:d.nome}, d.nome),
      el('div',{class:'barTrack'},[ el('div',{class:'barFill', style:`width:${pct}%;background:${color};`}) ]),
      el('div',{class:'barVal'}, brl(d.valor)),
    ]));
  });
  return wrap;
}
function renderMonthlyChart(data, highlightKey, color){
  const w=1000, h=230, padL=64, padB=26, padT=10;
  const max=Math.max(...data.map(d=>d.valor), 1);
  const gap=(w-padL-20)/Math.max(data.length,1);
  const barW=gap*0.6;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('width','100%'); svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  for(let i=0;i<=4;i++){
    const y=padT+(h-padT-padB)*(1-i/4);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',padL); line.setAttribute('x2',w-10); line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke','#EFEAE0'); svg.appendChild(line);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',padL-8); t.setAttribute('y',y+3); t.setAttribute('text-anchor','end');
    t.setAttribute('font-family','IBM Plex Mono'); t.setAttribute('font-size','9'); t.setAttribute('fill','#5C5748');
    t.textContent=brl(max*(i/4)); svg.appendChild(t);
  }
  data.forEach((d,i)=>{
    const bh=(h-padT-padB)*(d.valor/max);
    const x=padL+i*gap+(gap-barW)/2, y=h-padB-bh;
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',barW); rect.setAttribute('height',bh); rect.setAttribute('rx',3);
    rect.setAttribute('fill', d.key===highlightKey?'#BB8A34':color);
    const title=document.createElementNS('http://www.w3.org/2000/svg','title'); title.textContent=`${d.mes}: ${brl(d.valor)}`; rect.appendChild(title);
    svg.appendChild(rect);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x+barW/2); t.setAttribute('y',h-8); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family','IBM Plex Mono'); t.setAttribute('font-size','9.5'); t.setAttribute('fill','#5C5748');
    t.textContent=d.mes; svg.appendChild(t);
  });
  return svg;
}
function renderGroupedMonthlyChart(data){
  const w=1000, h=230, padL=64, padB=26, padT=10;
  const max=Math.max(...data.map(d=>Math.max(d.entrada,d.saida)), 1);
  const gap=(w-padL-20)/Math.max(data.length,1);
  const barW=Math.min(gap*0.34, 26);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('width','100%'); svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  for(let i=0;i<=4;i++){
    const y=padT+(h-padT-padB)*(1-i/4);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',padL); line.setAttribute('x2',w-10); line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke','#EFEAE0'); svg.appendChild(line);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',padL-8); t.setAttribute('y',y+3); t.setAttribute('text-anchor','end');
    t.setAttribute('font-family','IBM Plex Mono'); t.setAttribute('font-size','9'); t.setAttribute('fill','#5C5748');
    t.textContent=brl(max*(i/4)); svg.appendChild(t);
  }
  data.forEach((d,i)=>{
    const cx=padL+i*gap+gap/2;
    [['entrada','#5C7A63'],['saida','#A8462E']].forEach(([key,color],j)=>{
      const val=d[key];
      const bh=(h-padT-padB)*(val/max);
      const x=cx - barW - 2 + j*(barW+4);
      const y=h-padB-bh;
      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',barW); rect.setAttribute('height',bh); rect.setAttribute('rx',3);
      rect.setAttribute('fill',color);
      const title=document.createElementNS('http://www.w3.org/2000/svg','title'); title.textContent=`${d.mes} · ${key==='entrada'?'Entradas':'Saídas'}: ${brl(val)}`; rect.appendChild(title);
      svg.appendChild(rect);
    });
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',cx); t.setAttribute('y',h-8); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family','IBM Plex Mono'); t.setAttribute('font-size','9.5'); t.setAttribute('fill','#5C5748');
    t.textContent=d.mes; svg.appendChild(t);
  });
  return svg;
}

function renderContasTab(key){
  const cfg=TABS[key];
  const st=appState.data[key];
  const app=document.getElementById('app');

  if(!st.records){ app.appendChild(renderContasEmpty(key)); return; }

  const f=st.f;
  const base=st.records
    .filter(r=>f.situacao==='Todas'||r.situacao===f.situacao)
    .filter(r=>f.entidade==='Todos'||r.entidade===f.entidade)
    .filter(r=>f.categoria==='Todas'||r.categoria===f.categoria)
    .filter(r=>f.centro==='Todos'||r.centro===f.centro);
  const filtered=f.mes==='Todos'?base:base.filter(r=>r.mesKey===f.mes);

  const totalOriginal=filtered.reduce((s,r)=>s+r.valorOriginal,0);
  const totalFeito=filtered.reduce((s,r)=>s+r.valorFeito,0);
  const totalAberto=filtered.filter(r=>r.situacao==='Em aberto').reduce((s,r)=>s+r.valorAberto,0);
  const totalAtrasado=filtered.filter(r=>r.situacao==='Atrasado').reduce((s,r)=>s+r.valorAberto,0);
  const entCount=new Set(filtered.map(r=>r.entidade)).size;

  const updatedLabel=st.updatedAt?new Date(st.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

  app.appendChild(el('div',{class:'headerRow'},[
    el('div',{},[
      el('div',{class:'sub'},`Atualizado em ${updatedLabel} · ${st.records.length} lançamentos carregados`),
    ]),
    el('div',{style:'display:flex;gap:8px;'},[
      el('button',{class:'btn', onclick:()=>document.getElementById('fileInput-'+key).click()},'⟳ Atualizar dados'),
      el('button',{class:'btn ghost', onclick:()=>onResetContas(key)},'🗑 Limpar'),
    ]),
  ]));
  if(st.error) app.appendChild(el('div',{class:'err'},`⚠ ${st.error}`));

  const situacoes=Array.from(new Set(st.records.map(r=>r.situacao))).sort();
  const meses=Array.from(new Set(st.records.map(r=>r.mesKey))).sort().map(k=>{const [y,m]=k.split('-'); return {key:k,label:`${MONTH_FULL[parseInt(m,10)-1]}/${y}`};});
  const entidades=Array.from(new Set(st.records.map(r=>r.entidade))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const categorias=Array.from(new Set(st.records.map(r=>r.categoria))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const hasCentro=st.records.some(r=>r.centro!==null);
  const centros=hasCentro?Array.from(new Set(st.records.map(r=>r.centro))).sort((a,b)=>a.localeCompare(b,'pt-BR')):[];

  const filterRow=el('div',{class:'filters'},[
    filterSelect('Situação', f.situacao, v=>{f.situacao=v; render();}, ['Todas',...situacoes]),
    filterSelect('Mês', f.mes, v=>{f.mes=v; render();}, [{key:'Todos',label:'Todos os meses'},...meses]),
    filterSelect(cfg.entityLabel, f.entidade, v=>{f.entidade=v; render();}, ['Todos',...entidades]),
    filterSelect('Categoria', f.categoria, v=>{f.categoria=v; render();}, ['Todas',...categorias]),
  ]);
  if(hasCentro) filterRow.appendChild(filterSelect('Centro de custo', f.centro, v=>{f.centro=v; render();}, ['Todos',...centros]));
  app.appendChild(filterRow);

  app.appendChild(el('div',{class:'kpis'},[
    kpiTag('Total no período', brl(totalOriginal), 'ink', `${filtered.length} lançamentos`),
    kpiTag(cfg.doneLabel, brl(totalFeito), 'paper'),
    kpiTag(cfg.openLabel, brl(totalAberto), 'paper'),
    kpiTag(cfg.lateLabel, brl(totalAtrasado), totalAtrasado>0?'rust':'paper'),
    kpiTag(cfg.entityCountLabel, String(entCount), 'gold'),
  ]));

  // gráfico mensal (respeita situação/entidade/categoria/centro, ignora mês)
  const monthlyMap=new Map();
  base.forEach(r=>monthlyMap.set(r.mesKey,(monthlyMap.get(r.mesKey)||0)+r.valorOriginal));
  const monthlyData=Array.from(monthlyMap.entries()).sort(([a],[b])=>a<b?-1:1).map(([key,valor])=>{const [y,m]=key.split('-'); return {key, mes:`${MONTH_ABBR[parseInt(m,10)-1]}/${y.slice(2)}`, valor};});

  app.appendChild(sectionHead('ANO', cfg.chartTitle));
  app.appendChild(el('div',{class:'card', style:'margin-bottom:32px;'},[renderMonthlyChart(monthlyData, f.mes, cfg.chartColor)]));

  const topN=(recs,dim,base2)=>{
    const use = f[dim]===(dim==='entidade'?'Todos':'Todas') ? base2 : filtered;
    const map=new Map();
    use.forEach(r=>map.set(r[dim], (map.get(r[dim])||0)+r.valorOriginal));
    const sorted=Array.from(map.entries()).sort((a,b)=>b[1]-a[1]);
    const top=sorted.slice(0,7).map(([nome,valor])=>({nome: nome.length>24?nome.slice(0,22)+'…':nome, valor}));
    const restante=sorted.slice(7).reduce((s,[,v])=>s+v,0);
    if(restante>0) top.push({nome:`Outros (${sorted.length-7})`, valor:restante});
    return top;
  };
  const entBase=base.filter(r=>f.categoria==='Todas'||r.categoria===f.categoria).filter(r=>f.centro==='Todos'||r.centro===f.centro).filter(r=>f.mes==='Todos'||r.mesKey===f.mes);
  const catBase=base.filter(r=>f.entidade==='Todos'||r.entidade===f.entidade).filter(r=>f.centro==='Todos'||r.centro===f.centro).filter(r=>f.mes==='Todos'||r.mesKey===f.mes);
  const centroBase=base.filter(r=>f.entidade==='Todos'||r.entidade===f.entidade).filter(r=>f.categoria==='Todas'||r.categoria===f.categoria).filter(r=>f.mes==='Todos'||r.mesKey===f.mes);

  const topEntidades=topN(null,'entidade',entBase);
  const topCategorias=topN(null,'categoria',catBase);

  const cols=[
    el('div',{},[sectionHead('RANKING', cfg.rankEntityTitle), el('div',{class:'card'},[renderBars(topEntidades, cfg.chartColor)])]),
    el('div',{},[sectionHead('RANKING', cfg.rankCategoryTitle), el('div',{class:'card'},[renderBars(topCategorias, '#5C7A63')])]),
  ];
  if(hasCentro){
    const topCentros=topN(null,'centro',centroBase);
    cols.push(el('div',{},[sectionHead('RANKING', cfg.rankCentroTitle), el('div',{class:'card'},[renderBars(topCentros, '#BB8A34')])]));
  }
  app.appendChild(el('div',{class: hasCentro?'grid3':'grid2'}, cols));

  app.appendChild(sectionHead('IA', 'Análise escrita e exportações'));
  app.appendChild(renderAnalysisCard(key));

  app.appendChild(el('div',{class:'footer'},'Dados salvos automaticamente no seu banco de dados pessoal · disponíveis na próxima vez que abrir o painel'));
  app.appendChild(el('input',{type:'file', id:'fileInput-'+key, accept:'.xlsx,.xls,.csv', onchange:e=>onFileContas(key,e.target.files[0])}));
}

function renderContasEmpty(key){
  const cfg=TABS[key];
  const st=appState.data[key];
  const wrap=el('div',{class:'empty'});
  wrap.appendChild(el('p',{style:'font-size:14px;color:#5C5748;margin:8px 0 26px;'}, cfg.emptyHint+' A cada atualização, envie o mesmo relatório de novo — os dados anteriores são substituídos.'));
  const drop=el('div',{class:'drop'},[
    el('div',{style:'font-size:26px;margin-bottom:10px;opacity:.6;'},'⬆'),
    el('div',{style:"font-family:'IBM Plex Mono',monospace;font-size:13px;"},'Arraste o arquivo aqui, ou clique para escolher'),
    el('div',{style:'font-size:12px;opacity:.5;margin-top:4px;'},'.xlsx, .xls ou .csv'),
  ]);
  const fileInput=el('input',{type:'file', accept:'.xlsx,.xls,.csv', onchange:e=>onFileContas(key,e.target.files[0])});
  drop.addEventListener('click',()=>fileInput.click());
  drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); onFileContas(key,e.dataTransfer.files[0]);});
  wrap.appendChild(drop);
  wrap.appendChild(fileInput);
  if(st.error) wrap.appendChild(el('div',{class:'err'},`⚠ ${st.error}`));
  return wrap;
}

async function onFileContas(key,file){
  if(!file) return;
  const st=appState.data[key];
  st.error='';
  try{
    const recs=await parseContasGeneric(file, TABS[key]);
    st.records=recs;
    st.updatedAt=new Date().toISOString();
    st.f={situacao:'Todas', mes:'Todos', entidade:'Todos', categoria:'Todas', centro:'Todos'};
    st.analysis=blankAnalysis();
    await saveTab(key);
  }catch(e){ st.error=e.message||'Não foi possível ler este arquivo.'; }
  render();
  if(st.records) gerarAnalise(key);
}
async function onResetContas(key){
  if(!confirm('Apagar os dados carregados desta aba?')) return;
  try{ await window.storage.delete(TABS[key].storageKey, false); }catch(e){}
  appState.data[key]={records:null, updatedAt:null, error:'', f:{situacao:'Todas', mes:'Todos', entidade:'Todos', categoria:'Todas', centro:'Todos'}, analysis:blankAnalysis()};
  render();
}

  base.forEach(r=>{
    const cur=monthlyMap.get(r.mesKey)||{entrada:0,saida:0};
    if(r.tipo==='entrada') cur.entrada+=r.valorAbs; else cur.saida+=r.valorAbs;
    monthlyMap.set(r.mesKey,cur);
  });
  const monthlyData=Array.from(monthlyMap.entries()).sort(([a],[b])=>a<b?-1:1).map(([key,v])=>{const [y,m]=key.split('-'); return {key, mes:`${MONTH_ABBR[parseInt(m,10)-1]}/${y.slice(2)}`, ...v};});

  app.appendChild(sectionHead('ANO', 'Entradas x saídas por mês'));
  app.appendChild(el('div',{class:'card', style:'margin-bottom:32px;'},[
    el('div',{class:'legend'},[
      el('span',{},[el('i',{style:'background:#5C7A63;'}), 'Entradas']),
      el('span',{},[el('i',{style:'background:#A8462E;'}), 'Saídas']),
    ]),
    renderGroupedMonthlyChart(monthlyData),
  ]));

  const topByDesc=(tipo)=>{
    const map=new Map();
    filtered.filter(r=>r.tipo===tipo).forEach(r=>map.set(r.descricao, (map.get(r.descricao)||0)+r.valorAbs));
    const sorted=Array.from(map.entries()).sort((a,b)=>b[1]-a[1]);
    const top=sorted.slice(0,8).map(([nome,valor])=>({nome:nome.length>24?nome.slice(0,22)+'…':nome, valor}));
    const restante=sorted.slice(8).reduce((s,[,v])=>s+v,0);
    if(restante>0) top.push({nome:`Outros (${sorted.length-8})`, valor:restante});
    return top;
  };
  app.appendChild(el('div',{class:'grid2'},[
    el('div',{},[sectionHead('RANKING','Maiores saídas'), el('div',{class:'card'},[renderBars(topByDesc('saida'),'#A8462E')])]),
    el('div',{},[sectionHead('RANKING','Maiores entradas'), el('div',{class:'card'},[renderBars(topByDesc('entrada'),'#5C7A63')])]),
  ]));

  app.appendChild(sectionHead('IA', 'Análise escrita e exportações'));
  app.appendChild(renderAnalysisCard('extrato'));

  app.appendChild(el('div',{class:'footer'},'Dados salvos automaticamente no seu banco de dados pessoal · disponíveis na próxima vez que abrir o painel'));
  app.appendChild(el('input',{type:'file', id:'fileInput-extrato', accept:'.xlsx,.xls,.csv', onchange:e=>onFileExtrato(e.target.files[0])}));
}

function renderExtratoEmpty(){
  const st=appState.data.extrato;
  const wrap=el('div',{class:'empty'});
  wrap.appendChild(el('p',{style:'font-size:14px;color:#5C5748;margin:8px 0 26px;'},
    'Envie o extrato bancário exportado em .xlsx ou .csv (com colunas de Data, Descrição/Histórico e Valor). OFX ainda não é suportado — exporte em planilha.'));
  const drop=el('div',{class:'drop'},[
    el('div',{style:'font-size:26px;margin-bottom:10px;opacity:.6;'},'⬆'),
    el('div',{style:"font-family:'IBM Plex Mono',monospace;font-size:13px;"},'Arraste o arquivo aqui, ou clique para escolher'),
    el('div',{style:'font-size:12px;opacity:.5;margin-top:4px;'},'.xlsx, .xls ou .csv'),
  ]);
  const fileInput=el('input',{type:'file', accept:'.xlsx,.xls,.csv', onchange:e=>onFileExtrato(e.target.files[0])});
  drop.addEventListener('click',()=>fileInput.click());
  drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); onFileExtrato(e.dataTransfer.files[0]);});
  wrap.appendChild(drop);
  wrap.appendChild(fileInput);
  if(st.error) wrap.appendChild(el('div',{class:'err'},`⚠ ${st.error}`));
  return wrap;
}

async function onFileExtrato(file){
  if(!file) return;
  const st=appState.data.extrato;
  st.error='';
  try{
    const {records, saldoFinal}=await parseExtrato(file);
    st.records=records;
    st.saldoFinal=saldoFinal;
    st.updatedAt=new Date().toISOString();
    st.f={mes:'Todos', tipo:'Todas'};
    st.analysis=blankAnalysis();
    await saveTab('extrato');
  }catch(e){ st.error=e.message||'Não foi possível ler este arquivo.'; }
  render();
  if(st.records) gerarAnalise('extrato');
}
async function onResetExtrato(){
  if(!confirm('Apagar os dados carregados desta aba?')) return;
  try{ await window.storage.delete('dash-extrato-danese-v1', false); }catch(e){}
  appState.data.extrato={records:null, saldoFinal:null, updatedAt:null, error:'', f:{mes:'Todos', tipo:'Todas'}, analysis:blankAnalysis()};
  render();
}

// ---------- Render raiz ----------
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';

  app.appendChild(el('div',{},[
    el('div',{class:'eyebrow'},'DASHBOARD FINANCEIRO'),
    el('h1',{},'DANE SE · Painel financeiro'),
  ]));

  const tabDefs=[{key:'pagar',label:'Contas a Pagar'},{key:'receber',label:'Contas a Receber'},{key:'extrato',label:'Extrato Bancário'}];
  app.appendChild(el('div',{class:'tabbar'}, tabDefs.map(t=>el('button',{
    class:'tabbtn'+(appState.activeTab===t.key?' active':''),
    onclick:()=>{appState.activeTab=t.key; render();},
  }, t.label))));

  if(appState.activeTab==='extrato') renderExtratoTab();
  else renderContasTab(appState.activeTab);
}

document.getElementById('app').innerHTML='<div style="padding:60px 0;text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:12px;opacity:.5;">Carregando dados salvos…</div>';
(async()=>{
  await loadAll();
  render();
})();
</script>
